# docker-compose.yml
version: '3.9'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/insightai
      OPENAI_API_KEY: your_openai_key_here
    depends_on:
      - db
    volumes:
      - .:/app
    command: sh -c "npx prisma migrate deploy && npm start"

  db:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insightai
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: